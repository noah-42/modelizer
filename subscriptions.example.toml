# Subscriptions — what each plan costs and when it charges.
#
# Copy to subscriptions.toml (gitignored) and edit. Providers with an adapter fill in the
# plan and billing state themselves (Claude, Cursor, OpenAI via Codex); this file supplies
# the facts no provider API exposes: the price you pay and the day of the month it charges.
#
# Fields
#   price      amount per billing period, in `currency` (default USD)
#   price_next amount charged from the next renewal on, for intro offers
#   period     "monthly" (default) or "annual"
#   renews_day day of month it charges (1-31, clamped in short months)
#   renews_at  ISO date of a known past charge, rolled forward — use for annual auto-renewals
#   ends_at    paid-through date of a prepaid term that does not auto-renew
#   label      display name when the plan has no catalogue entry
#   seats      seat count, when the plan is per seat
#
# Cost defaults to the plan's list price when the plan is recognised (Claude Pro $20,
# Cursor Pro $20 / Pro+ $60 / Ultra $200, ChatGPT Plus $20 / Pro $200, SuperGrok $30 / Heavy $300).
# Set price when your rate differs: annual, student, regional VAT, grandfathered.
# The values below are examples — replace them with what you are actually charged.

[[subscription]]
provider = "claude"
# plan is detected from Anthropic's profile; recorded here only to pin it
plan = "pro"
price = 20
renews_day = 13

# OpenAI via Codex: the plan (Plus/Pro) comes from Codex's own login; price and date do not.
[[subscription]]
provider = "codex"
plan = "plus"
price = 20
renews_day = 20

# A regional price with an intro rate: charged 15 now, 30 from the second month on. The page
# shows both and totals the recurring 30. One block per provider — provider ids match the cards.
[[subscription]]
provider = "cursor"
plan = "pro"
currency = "EUR"
price = 15
price_next = 30
state = "active"
renews_day = 4

# xAI / Grok has no adapter (its API exposes API-key credits, not the subscription): add a block
# like these if you hold SuperGrok.

# Prepaid annual term: no monthly charge, so it is shown as a paid-through date instead.
[[subscription]]
provider = "zai"
label = "GLM Coding (annual)"
currency = "EUR"
price = 36
period = "annual"
ends_at = "2027-02-28"
